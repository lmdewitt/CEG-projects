format:
  html:
    backgroundcolor: "#fdfdfd"
    theme:
      light: [cosmo, theme.scss] 
      dark: [cosmo, theme-dark.scss]
    css: style.css
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    link-external-icon: true
    toc: true

filters:
  - include-files.lua
  - quarto

engine: knitr  
